# /etc/hostapd/hostapd.conf として新規作成する
# ssid と wpa_passphrase は環境に合わせて変更する
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
interface=ap0
driver=nl80211
ssid=UNVTPortable
hw_mode=g
country_code=JP
channel=11
ieee80211d=1
wmm_enabled=1
macaddr_acl=0
auth_algs=1
wpa=2
wpa_passphrase=CHANGE_ME
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
ignore_broadcast_ssid=0
